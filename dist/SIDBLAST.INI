[SIDBlaster]
; COM port of the SIDBlaster (Device Manager > Ports, or run SBTEST).
; Leave empty to auto-detect from the FTDI entries in the registry.
Port=
; Pitch correction for the SIDBlaster's 1 MHz SID clock:
; PAL (default), NTSC, or OFF
Clock=PAL
; Actual SID clock in Hz. The PIC runs from its internal oscillator, so a
; unit can be slightly off; adjust if your SIDBlaster is out of tune.
SidClock=1000000
; Log file SIDBLAST.LOG next to the DLL, for troubleshooting:
; 0 = off, 1 = init + once-per-second stats, 2 = every register write (big!)
Log=0
; Writer thread priority: 15 time-critical, 2 highest, 1 above normal, 0 normal
Priority=15

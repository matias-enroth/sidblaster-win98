[SIDBlaster]
; What to play on:
;   SIDBlaster  a SIDBlaster-USB on a COM port (the default)
;   NetSID      a Network SID Device server over TCP/IP, such as SID-Device
;               or JSIDPlay2 on another computer (see README.TXT)
Backend=SIDBlaster
; PAL (default), NTSC, or OFF.
;   SIDBlaster: pitch correction for the SIDBlaster's 1 MHz SID clock.
;   NetSID: the C64 clock the server emulates (OFF means PAL).
Clock=PAL

; ---- SIDBlaster
; COM port of the SIDBlaster (Device Manager > Ports, or run SBTEST).
; Leave empty to auto-detect from the FTDI entries in the registry.
Port=
; Actual SID clock in Hz. The PIC runs from its internal oscillator, so a
; unit can be slightly off; adjust if your SIDBlaster is out of tune.
SidClock=1000000

; ---- NetSID
; The server's IP address, e.g. 192.168.1.20. A name works too, but looking
; it up can stall SIDPLAY when the network is down.
Host=
NetPort=6581
; Milliseconds of music buffered at the server. It covers for Windows
; stalls (a program starting up); the music also plays this much late.
Lead=100
; SID on the server: a config number (0 = the first; the log and SBTEST NET
; list them), or 6581 / 8580 for the first config of that model.
Model=0
; Minimum C64 cycles between two writes within a frame (0 = as SIDPLAY made them)
MinSpacing=0

; Log file SIDBLAST.LOG next to the DLL, for troubleshooting:
; 0 = off, 1 = init + once-per-second stats, 2 = every register write (big!)
Log=0
; Writer thread priority: 15 time-critical, 2 highest, 1 above normal, 0 normal
Priority=15
